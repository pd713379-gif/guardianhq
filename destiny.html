<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardian UI</title>

  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at center, #1a0033, #000);
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .left {
      width: 25%;
      padding: 20px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }

    .center {
      width: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .right {
      width: 25%;
      padding: 20px;
      border-left: 1px solid rgba(255,255,255,0.1);
    }

    .character {
      width: 200px;
      height: 400px;
      background: linear-gradient(#5a00a0, #2a004f);
      border-radius: 100px 100px 20px 20px;
      position: relative;
      box-shadow: 0 0 40px rgba(140, 0, 255, 0.6);
    }

    .eye {
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 80px;
    }

    .eye.left { left: 60px; }
    .eye.right { right: 60px; }

    .chest {
      width: 12px;
      height: 12px;
      background: #c084ff;
      border-radius: 50%;
      position: absolute;
      top: 160px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 15px #c084ff;
    }

    .item {
      margin-bottom: 15px;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
    }

    .power {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 32px;
      color: gold;
    }

  </style>
</head>
<body>

<div class="container">
  <div class="left">
    <h3>Weapons</h3>
    <div class="item">Praxis Blade</div>
    <div class="item">Fortunate Star</div>
    <div class="item">Chain of Command</div>
  </div>

  <div class="center">
    <div class="power">550</div>

    <div class="character">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="chest"></div>
    </div>
  </div>

  <div class="right">
    <h3>Armor</h3>
    <div class="item">Techsec Mask</div>
    <div class="item">Ketchkiller's Grips</div>
    <div class="item">Lustrous Vest</div>
    <div class="item">Fortune's Favor</div>
    <div class="item">Techsec Cloak</div>
  </div>
</div>

<script>
// FIX: zorg dat pagina zichtbaar blijft
window.addEventListener("load", () => {
  document.documentElement.style.visibility = "visible";
});
</script>

</body>
</html>
