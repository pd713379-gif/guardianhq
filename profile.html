<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profiel Test</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;padding:20px}
.avatar{width:100px;height:100px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:40px;cursor:pointer;margin-bottom:10px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:10px}
.item{padding:10px;background:#1e293b;text-align:center;cursor:pointer;border-radius:10px}
.item:hover{background:#334155}
.hidden{display:none}
input,textarea{width:100%;margin:5px 0;padding:8px;border-radius:6px;border:none}
button{padding:10px;margin-top:10px;cursor:pointer}
.msg{margin-top:10px;font-size:14px}
</style>
</head>
<body>

<h2>Profiel</h2>

<div class="avatar" id="avatar" onclick="openPicker()">😀</div>
<div class="msg" id="msg"></div>

<h3 id="name">Naam</h3>
<p id="bio"></p>

<button onclick="openEdit()">Bewerk profiel</button>

<!-- EDIT -->
<div id="editBox" class="hidden">
<h3>Bewerk</h3>
<input id="editName" placeholder="Naam">
<textarea id="editBio" placeholder="Bio"></textarea>
<input type="file" id="upload" accept="image/png,image/jpeg,image/webp" onchange="uploadAvatar(event)">
<button onclick="saveProfile()">Opslaan</button>
</div>

<!-- PICKER -->
<div id="picker" class="hidden">
<h3>Kies avatar</h3>
<div class="grid" id="grid"></div>
<button onclick="closePicker()">Sluiten</button>
</div>

<script>
// 👉 ICONS
const AVATARS = ['😀','😎','🔥','⚡','🎯','🛡️','🏹','🚀','🐉','👑'];

let selected = localStorage.getItem('avatar') || '😀';

function showMsg(text,color="lightgreen"){
  const el=document.getElementById('msg');
  el.style.color=color;
  el.textContent=text;
  setTimeout(()=>el.textContent="",3000);
}

function init(){
  const img = localStorage.getItem('avatar_img');
  if(img){
    document.getElementById('avatar').innerHTML=`<img src="${img}" style="width:100%;height:100%;object-fit:cover">`;
  } else {
    document.getElementById('avatar').textContent = selected;
  }
  const data = JSON.parse(localStorage.getItem('profile')||'{}');
  document.getElementById('name').textContent = data.name||'Naam';
  document.getElementById('bio').textContent = data.bio||'';
}

function openPicker(){
  const grid = document.getElementById('grid');
  grid.innerHTML = AVATARS.map(a=>
    `<div class="item" onclick="selectAvatar('${a}')">${a}</div>`
  ).join('');
  document.getElementById('picker').classList.remove('hidden');
}

function closePicker(){
  document.getElementById('picker').classList.add('hidden');
}

function selectAvatar(a){
  selected = a;
  localStorage.removeItem('avatar_img');
  localStorage.setItem('avatar',a);
  document.getElementById('avatar').textContent = a;
  showMsg("Avatar opgeslagen");
}

function openEdit(){
  document.getElementById('editBox').classList.remove('hidden');
}

function saveProfile(){
  const data = {
    name: document.getElementById('editName').value,
    bio: document.getElementById('editBio').value
  };
  localStorage.setItem('profile',JSON.stringify(data));
  init();
  showMsg("Profiel opgeslagen");
}

// 🔥 UPLOAD MET REGELS
function uploadAvatar(e){
  const file = e.target.files[0];
  if(!file) return;

  // TYPE CHECK
  const allowed = ['image/png','image/jpeg','image/webp'];
  if(!allowed.includes(file.type)){
    showMsg("Alleen PNG, JPG of WebP toegestaan","red");
    return;
  }

  // SIZE CHECK (500KB)
  if(file.size > 500*1024){
    showMsg("Max 500KB toegestaan","red");
    return;
  }

  const reader = new FileReader();
  reader.onload = function(){
    const img = new Image();
    img.onload = function(){

      // DIMENSIE CHECK
      if(img.width > 400 || img.height > 400){
        showMsg("Max 400x400 pixels toegestaan","red");
        return;
      }

      // ⚠️ SIMPELE 18+ CHECK (basic placeholder)
      // echte detectie = server/AI nodig
      const fakeCheck = false; // altijd safe nu
      if(fakeCheck){
        localStorage.removeItem('avatar_img');
        showMsg("18+ afbeelding geblokkeerd","red");
        return;
      }

      // OPSLAAN
      document.getElementById('avatar').innerHTML=`<img src="${reader.result}" style="width:100%;height:100%;object-fit:cover">`;
      localStorage.setItem('avatar_img', reader.result);
      localStorage.removeItem('avatar');

      showMsg("Upload gelukt!");
    }
    img.src = reader.result;
  }
  reader.readAsDataURL(file);
}

// LOAD
init();
</script>

</body>
</html>
