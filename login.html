<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inloggen — GuardianHQ</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>document.documentElement.style.visibility="hidden";</script>
</head>
<body>

  <div class="mesh">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>

  <nav>
    <div class="nav-wrap">
      <a class="logo" href="index.html">
        <div class="logo-icon">G</div>
        <span class="logo-text">GuardianHQ</span>
      </a>
      <div class="nav-center">
        <a href="landing.html">Welkom</a>
        <a href="home.html">Info</a>
        <a href="destiny.html">Destiny 2</a>
        <a href="profile.html">Profiel</a>
        <a href="contact.html">Contact</a>
        <a href="discord.html" class="discord-link"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.1 18.078.11 18.1.132 18.113a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>Discord</a>
      </div>
      <div class="nav-auth" id="navAuth">
        <a href="login.html" class="btn btn-ghost active">Inloggen</a>
        <a href="register.html" class="btn btn-solid">Registreren</a>
      
      </div>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card glass">

      <div class="auth-logo-center">
        <div class="logo-icon">G</div>
        <span class="logo-text" style="font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;letter-spacing:2px">GuardianHQ</span>
      </div>

      <h1 class="auth-head">Welkom terug</h1>
      <p class="auth-sub">Log in en ga verder waar je gebleven was, Guardian.</p>

      <div class="alert alert-success" id="alertSuccess">✓ Ingelogd! Je wordt doorgestuurd...</div>
      <div class="alert alert-error"   id="alertError"></div>

      <div class="field">
        <label class="field-label">E-mailadres</label>
        <input class="field-input" type="email" id="loginEmail" placeholder="jij@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label class="field-label">Wachtwoord</label>
        <input class="field-input" type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button class="submit-btn" id="loginBtn" onclick="handleLogin()">Inloggen</button>

      <div class="auth-footer" style="margin-top:1rem">
        Nog geen account? <a href="register.html">Registreer hier</a>
      </div>

    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Redirect als al ingelogd
    if (getCurrentUser()) window.location.href = 'destiny.html';

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass  = document.getElementById('loginPass').value;
      const btn   = document.getElementById('loginBtn');

      document.getElementById('alertError').classList.remove('show');
      document.getElementById('alertSuccess').classList.remove('show');

      if (!email || !pass) {
        document.getElementById('alertError').textContent = 'Vul je e-mailadres en wachtwoord in.';
        document.getElementById('alertError').classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Inloggen...';

      try {
        await loginUser(email, pass);
        document.getElementById('alertSuccess').classList.add('show');
        btn.textContent = '✓ Ingelogd!';
        setTimeout(() => window.location.href = 'destiny.html', 1500);
      } catch(e) {
        document.getElementById('alertError').textContent = e.message;
        document.getElementById('alertError').classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Inloggen';
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
  <script>document.addEventListener("DOMContentLoaded",function(){document.documentElement.style.visibility="";});</script>
</body>
</html>
