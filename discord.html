<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardian HQ</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Inter',sans-serif;
    background:#0f1115;
    color:#fff;
}

/* NAV */
.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 30px;
    background:#0f1115;
    border-bottom:1px solid #1c1f26;
}

.logo{
    font-weight:600;
    color:#fff;
}

.links a{
    margin-left:20px;
    color:#b5bac1;
    text-decoration:none;
    font-size:14px;
}

.links a:hover{
    color:#fff;
}

/* HERO */
.hero{
    height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.box{
    max-width:500px;
    width:100%;
}

/* TITLE */
h1{
    font-size:40px;
    font-weight:600;
    margin-bottom:15px;
}

p{
    color:#b5bac1;
    line-height:1.6;
}

/* BUTTON */
.btn{
    display:inline-block;
    margin-top:25px;
    padding:14px 28px;
    background:#5865F2;
    color:#fff;
    border-radius:8px;
    text-decoration:none;
    font-weight:600;
    transition:0.2s;
}

.btn:hover{
    background:#4752c4;
    transform:translateY(-2px);
}

/* SUBTLE GLOW */
.glow{
    position:absolute;
    width:400px;
    height:400px;
    background:radial-gradient(circle, rgba(88,101,242,0.15), transparent);
    top:30%;
    left:50%;
    transform:translateX(-50%);
    filter:blur(40px);
}

/* MOBILE */
@media(max-width:768px){

    .links{
        display:none;
    }

    h1{
        font-size:28px;
    }
}
</style>
</head>

<body>

<div class="glow"></div>

<nav class="nav">
    <div class="logo">Guardian HQ</div>

    <div class="links">
        <a href="landing.html">Welkom</a>
        <a href="home.html">Home</a>
        <a href="destiny.html">Destiny2</a>
        <a href="contact.html">Contact</a>
        <a href="profile.html">Profiel</a>
    </div>
</nav>

<section class="hero">
    <div class="box">

        <h1>Join the Tower</h1>

        <p>
        Build Fireteams, run raids, and play Destiny together.
        </p>

        <a class="btn" href="https://discord.gg/3jXMneeY" target="_blank">
            Join Discord
        </a>

    </div>
</section>

</body>
</html>
