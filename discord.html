<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardian HQ | Enter the Tower</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>
* {margin:0;padding:0;box-sizing:border-box;}

body {
    font-family:'Orbitron',sans-serif;
    background:#000;
    color:white;
    overflow:hidden;
}

/* 🌌 STAR LAYERS */
.stars, .stars2, .stars3 {
    position:absolute;
    width:100%;
    height:100%;
    background:url('https://raw.githubusercontent.com/VincentGarreau/particles.js/master/demo/media/starfield.png');
    animation:moveStars linear infinite;
}

.stars {animation-duration:60s; opacity:0.5;}
.stars2 {animation-duration:120s; opacity:0.3; transform:scale(1.5);}
.stars3 {animation-duration:180s; opacity:0.15; transform:scale(2);}

@keyframes moveStars {
    from {transform:translateY(0);}
    to {transform:translateY(-1000px);}
}

/* NAV */
.nav {
    position:fixed;
    top:0;
    width:100%;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(10px);
    z-index:10;
}

.logo {color:#f5c542;font-weight:bold;}

.links {
    display:flex;
    gap:15px;
}

.links a {
    color:white;
    text-decoration:none;
    opacity:0.7;
}

.links a:hover {
    color:#f5c542;
    opacity:1;
}

/* 🍔 MOBILE MENU */
.menu-toggle {
    display:none;
    font-size:1.5rem;
    cursor:pointer;
}

@media(max-width:768px){
    .links {
        display:none;
        flex-direction:column;
        position:absolute;
        top:60px;
        right:10px;
        background:rgba(0,0,0,0.9);
        padding:15px;
        border-radius:10px;
    }

    .links.active {display:flex;}
    .menu-toggle {display:block;}
}

/* HERO */
.hero {
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

/* CARD */
.card {
    padding:40px;
    max-width:600px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(12px);
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 0 40px rgba(245,197,66,0.2);
    animation:fadeIn 1s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(30px);}
    to {opacity:1; transform:translateY(0);}
}

h1 {
    color:#f5c542;
    font-size:2.5rem;
    text-shadow:0 0 25px rgba(245,197,66,0.5);
}

p {
    margin-top:20px;
    font-size:0.95rem;
    opacity:0.85;
}

/* BUTTON */
.big-btn {
    margin-top:30px;
    display:inline-block;
    padding:15px 30px;
    background:linear-gradient(135deg,#f5c542,#ffdf70);
    color:black;
    border-radius:12px;
    text-decoration:none;
    font-weight:bold;
    box-shadow:0 0 30px rgba(245,197,66,0.6);
    animation:pulse 2s infinite;
}

@keyframes pulse {
    0% {box-shadow:0 0 20px rgba(245,197,66,0.4);}
    50% {box-shadow:0 0 40px rgba(245,197,66,1);}
    100% {box-shadow:0 0 20px rgba(245,197,66,0.4);}
}

/* 🚀 LOADING SCREEN */
.loader {
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:999;
}

.loader.hidden {display:none;}

.loader h2 {
    color:#f5c542;
    margin-top:10px;
    animation:blink 1s infinite;
}

@keyframes blink {
    0%,100%{opacity:1;}
    50%{opacity:0.3;}
}
</style>
</head>

<body>

<!-- LOADING -->
<div class="loader" id="loader">
    <h1>🌌 Guardian HQ</h1>
    <h2>Entering the Tower...</h2>
</div>

<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>

<!-- NAV -->
<nav class="nav">
    <div class="logo">Guardian HQ</div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="links" id="menu">
        <a href="landing.html">Welkom</a>
        <a href="home.html">Home</a>
        <a href="destiny.html">Destiny2</a>
        <a href="contact.html">Contact</a>
        <a href="profile.html">Profiel</a>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <div class="card">
        <h1>Enter the Tower</h1>

        <p>
        Guardians gather to build Fireteams and conquer Destiny’s toughest challenges.<br><br>
        Choose your path. Become legend.
        </p>

        <a class="big-btn" href="https://discord.gg/3jXMneeY" target="_blank">
            🚀 JOIN NOW
        </a>
    </div>
</section>

<script>
function toggleMenu(){
    document.getElementById("menu").classList.toggle("active");
}

/* loader effect */
window.onload = () => {
    setTimeout(()=>{
        document.getElementById("loader").classList.add("hidden");
    },1500);
}
</script>

</body>
</html>
