<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardian HQ</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Inter',sans-serif;
    background: radial-gradient(circle at top, #11131a, #05060a);
    color:white;
    min-height:100vh;
    overflow:hidden;
}

/* 🌌 STAR LAYERS */
.stars{position:fixed;width:100%;height:100%;top:0;left:0;z-index:-1;}

.star{
    position:absolute;
    border-radius:50%;
    background:white;
    animation:twinkle ease-in-out infinite;
}

.small{width:1px;height:1px;opacity:0.3;}
.medium{width:2px;height:2px;opacity:0.6;}
.big{width:3px;height:3px;opacity:0.9;}

@keyframes twinkle{
    0%,100%{opacity:0.2;transform:scale(1);}
    50%{opacity:1;transform:scale(1.5);}
}

/* 💫 SHOOTING STAR */
.shoot{
    position:absolute;
    width:120px;
    height:2px;
    background:linear-gradient(90deg, white, transparent);
    opacity:0;
}

@keyframes shoot{
    0%{transform:translateX(0) translateY(0); opacity:1;}
    100%{transform:translateX(-600px) translateY(300px); opacity:0;}
}

/* 🖱️ MOUSE GLOW */
.glow{
    position:fixed;
    width:300px;
    height:300px;
    background:radial-gradient(circle, rgba(88,101,242,0.15), transparent);
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:-1;
}

/* NAV */
.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 30px;

    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.links a{
    margin-left:20px;
    color:#b5bac1;
    text-decoration:none;
    font-size:14px;
}
.links a:hover{color:white;}

/* HERO */
.hero{
    height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* GLASS CARD */
.card{
    max-width:520px;
    width:100%;
    padding:35px;

    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);

    border-radius:16px;
    border:1px solid rgba(255,255,255,0.12);

    box-shadow:
        0 0 40px rgba(0,0,0,0.4),
        inset 0 0 20px rgba(255,255,255,0.03);
}

/* TEXT */
h1{font-size:36px;margin-bottom:10px;}
p{color:#b5bac1;line-height:1.6;}

/* BUTTON */
.btn{
    display:inline-block;
    margin-top:25px;
    padding:14px 26px;

    background:#5865F2;
    border-radius:8px;
    text-decoration:none;
    color:white;
    font-weight:600;

    box-shadow:0 0 20px rgba(88,101,242,0.4);
    transition:0.2s;
}

.btn:hover{
    transform:translateY(-2px);
    background:#4752c4;
}

/* MOBILE */
@media(max-width:768px){
    .links{display:none;}
    h1{font-size:26px;}
    .card{padding:25px;}
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>
<div class="glow" id="glow"></div>

<nav class="nav">
    <div>Guardian HQ</div>

    <div class="links">
        <a href="landing.html">Welkom</a>
        <a href="home.html">Home</a>
        <a href="destiny.html">Destiny2</a>
        <a href="contact.html">Contact</a>
        <a href="profile.html">Profiel</a>
    </div>
</nav>

<section class="hero">
    <div class="card">

        <h1>Join the Tower</h1>

        <p>
        Build Fireteams, run raids and play together with other Guardians.
        </p>

        <a class="btn" href="https://discord.gg/3jXMneeY" target="_blank">
            Join Discord
        </a>

    </div>
</section>

<script>
// 🌌 STARS
const container = document.getElementById("stars");

for(let i=0;i<140;i++){
    const star=document.createElement("div");

    let sizeClass = ["small","medium","big"][Math.floor(Math.random()*3)];
    star.className = "star " + sizeClass;

    star.style.top=Math.random()*100+"%";
    star.style.left=Math.random()*100+"%";

    star.style.animationDuration=(2+Math.random()*3)+"s";
    star.style.animationDelay=Math.random()*3+"s";

    container.appendChild(star);
}

// 💫 SHOOTING STAR
setInterval(()=>{
    const s=document.createElement("div");
    s.className="shoot";

    s.style.top=Math.random()*50+"%";
    s.style.left=(50+Math.random()*50)+"%";

    s.style.animation="shoot 1s linear";

    document.body.appendChild(s);

    setTimeout(()=>s.remove(),1000);
},4000);

// 🖱️ MOUSE GLOW
const glow=document.getElementById("glow");

document.addEventListener("mousemove",(e)=>{
    glow.style.left=e.clientX+"px";
    glow.style.top=e.clientY+"px";
});
</script>

</body>
</html>
