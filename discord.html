<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardian HQ</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Inter',sans-serif;
    background:#0a0a0a;
    color:white;
}

/* NAV */
.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
}

.logo{
    font-weight:600;
    font-size:14px;
    letter-spacing:1px;
}

.links a{
    margin-left:20px;
    text-decoration:none;
    color:#aaa;
    font-size:14px;
}

.links a:hover{
    color:white;
}

/* HERO */
.hero{
    height:90vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.hero h1{
    font-size:48px;
    font-weight:600;
    margin-bottom:20px;
}

.hero p{
    max-width:500px;
    color:#aaa;
    line-height:1.6;
}

/* BUTTON */
.btn{
    margin-top:30px;
    padding:14px 28px;
    border-radius:30px;
    background:white;
    color:black;
    text-decoration:none;
    font-weight:500;
    transition:0.2s;
}

.btn:hover{
    transform:scale(1.05);
}

/* MOBILE */
@media(max-width:768px){
    .hero h1{font-size:32px;}
}
</style>
</head>

<body>

<nav class="nav">
    <div class="logo">Guardian HQ</div>

    <div class="links">
        <a href="landing.html">Welkom</a>
        <a href="home.html">Home</a>
        <a href="destiny.html">Destiny</a>
        <a href="contact.html">Contact</a>
        <a href="profile.html">Profiel</a>
    </div>
</nav>

<section class="hero">
    <h1>Join the Tower</h1>

    <p>
    A place where Destiny players connect, build Fireteams and play endgame content together.
    </p>

    <a class="btn" href="https://discord.gg/3jXMneeY" target="_blank">
        Join Discord
    </a>
</section>

</body>
</html>
