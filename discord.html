<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardian HQ</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Inter',sans-serif;
    background: radial-gradient(circle at top, #11131a, #05060a);
    color:white;
    min-height:100vh;
}

/* 🌌 NAV GLASS */
.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 30px;

    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(12px);

    border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{
    font-weight:600;
}

.links a{
    margin-left:20px;
    color:#b5bac1;
    text-decoration:none;
    font-size:14px;
}

.links a:hover{
    color:white;
}

/* HERO */
.hero{
    height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* 💎 GLASS CARD */
.card{
    max-width:520px;
    width:100%;
    padding:35px;

    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px);

    border-radius:16px;
    border:1px solid rgba(255,255,255,0.1);

    box-shadow:0 0 40px rgba(0,0,0,0.4);
}

/* TITLE */
h1{
    font-size:36px;
    margin-bottom:10px;
}

p{
    color:#b5bac1;
    line-height:1.6;
}

/* BUTTON */
.btn{
    display:inline-block;
    margin-top:25px;
    padding:14px 26px;

    background:rgba(88,101,242,0.9);
    backdrop-filter:blur(10px);

    border-radius:8px;
    text-decoration:none;
    color:white;
    font-weight:600;

    box-shadow:0 0 20px rgba(88,101,242,0.4);
    transition:0.2s;
}

.btn:hover{
    background:#5865F2;
    transform:translateY(-2px);
}

/* SUBTLE LIGHT */
.glow{
    position:absolute;
    width:500px;
    height:500px;
    background:radial-gradient(circle, rgba(88,101,242,0.15), transparent);
    top:20%;
    left:50%;
    transform:translateX(-50%);
    filter:blur(60px);
}

/* MOBILE */
@media(max-width:768px){

    .links{
        display:none;
    }

    h1{
        font-size:26px;
    }

    .card{
        padding:25px;
    }
}
</style>
</head>

<body>

<div class="glow"></div>

<nav class="nav">
    <div class="logo">Guardian HQ</div>

    <div class="links">
        <a href="landing.html">Welkom</a>
        <a href="home.html">Home</a>
        <a href="destiny.html">Destiny2</a>
        <a href="contact.html">Contact</a>
        <a href="profile.html">Profiel</a>
    </div>
</nav>

<section class="hero">
    <div class="card">

        <h1>Join the Tower</h1>

        <p>
        Build Fireteams, run raids and play together with other Guardians.
        </p>

        <a class="btn" href="https://discord.gg/3jXMneeY" target="_blank">
            Join Discord
        </a>

    </div>
</section>

</body>
</html>
